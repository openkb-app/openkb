config:
  # The modules above ship their own copy of the simple config in
  # config/; the recipe overrides it as they install. Strict would
  # refuse the difference instead.
  strict: false
  actions:
    ai.settings:
      simpleConfigUpdate:
        prompt_logging: false
        prompt_logging_tags: ''
        default_providers:
          chat:
            provider_id: openai
            model_id: gpt-5.6-luna
          embeddings:
            provider_id: openai
            model_id: text-embedding-3-small
        default_vdb_provider: opensearch
        request_timeout: 60
        allowed_hosts: {  }
        allowed_hosts_rewrite_links: false
        global_guardrails: {  }
    ai_provider_openai.settings:
      simpleConfigUpdate:
        api_key: openai_env
        moderation: true
        host: ''
    jsonapi.settings:
      simpleConfigUpdate:
        read_only: false
        maintenance_header_retry_seconds:
          min: 5
          max: 10
    lupus_decoupled_site_info.settings:
      simpleConfigUpdate:
        expose:
          - 'system.site:name'
          - 'system.site:slogan'
          - 'system.site:mail'
        permissions:
          - 'create openkb_space'
          - 'create kb_page content'
          - 'access administration pages'
    mcp_server.settings:
      simpleConfigUpdate:
        server_name: OpenKB
        server_version: 1.0.0
        server_instructions: 'The OpenKB knowledge base. Content lives in spaces, and a space is an access boundary: call tool_api__list_spaces to see which ones you may work in and what you may do in each. Before creating a page, call tool_api__list_spaces with access="write" and create only into a space it returns — the first segment of a page path is its space slug, and a space is never created as a side effect of a page write. Read a page with tool_api__get_page, by its path; it answers the page as it stands published. Find one with tool_api__search_pages, which answers only pages you may read — it reads the published index, so unfinished work is found with tool_api__find_drafts instead. When you connect, call tool_api__list_assignments: it answers the comment threads people handed to you while you were away.'
        pagination_limit: 50
        pending:
          poll_interval_ms: 300
          sampling_timeout: 25
          elicitation_timeout: 600
    node.settings:
      simpleConfigUpdate:
        use_admin_theme: true
    openkb_agent_registration.settings:
      simpleConfigUpdate:
        enabled: true
        scopes:
          - agent_read
          - agent_write
    openkb_search.settings:
      simpleConfigUpdate:
        chunk_index: kb_chunks
        vector_floor: 0.75
        chunk:
          target_tokens: 300
          max_tokens: 500
    openkb_tools.settings:
      simpleConfigUpdate:
        search:
          top_k: 10
        session_endpoint: ''
    simple_oauth.settings:
      simpleConfigUpdate:
        scope_provider: dynamic
        token_cron_batch_size: 0
        public_key: 'private://simple_oauth/public.key'
        private_key: 'private://simple_oauth/private.key'
        disable_openid_connect: false
    simple_oauth_personal_consumers.settings:
      simpleConfigUpdate:
        scopes:
          - agent_read
          - agent_write
        unclaimed_retention: 604800
    system.file:
      simpleConfigUpdate:
        allow_insecure_uploads: false
        default_scheme: public
        temporary_maximum_age: 21600
    system.mail:
      simpleConfigUpdate:
        interface:
          default: php_mail
        mailer_dsn:
          scheme: sendmail
          host: default
          user: null
          password: null
          port: null
          options: {  }
    system.theme:
      simpleConfigUpdate:
        admin: claro
        default: stark
    system.theme.global:
      simpleConfigUpdate:
        favicon:
          mimetype: image/vnd.microsoft.icon
          path: ''
          url: ''
          use_default: true
        features:
          comment_user_picture: true
          comment_user_verification: true
          favicon: true
          node_user_picture: true
        logo:
          path: ''
          url: null
          use_default: true
    trash.settings:
      simpleConfigUpdate:
        enabled_entity_types:
          node:
            - kb_page
        auto_purge:
          enabled: true
          after: '30 days'
        compact_overview: false
    update.settings:
      simpleConfigUpdate:
        check:
          disabled_extensions: false
          interval_days: 1
        fetch:
          url: null
          max_attempts: 2
          timeout: 30
        notification:
          emails: {  }
          threshold: security
    user.role.anonymous:
      grantPermissions:
        - 'access content'
        - 'restful get rest_menu_item'
        - 'use text format restricted_html'
        - 'view media'
    user.role.authenticated:
      grantPermissions:
        - 'access content'
        - 'access mcp server'
        - 'access user profiles'
        - 'create kb_page content'
        - 'create media'
        - 'create openkb_space'
        - 'create url aliases'
        - 'delete own files'
        - 'delete own kb_page content'
        - 'edit any kb_page content'
        - 'grant simple_oauth codes'
        - 'manage own personal consumers'
        - 'restful get lupus_decoupled_site_info'
        - 'restful get rest_menu_item'
        - 'use editorial transition create_new_draft'
        - 'use editorial transition publish'
        - 'use editorial transition submit_for_review'
        - 'use inline comments api'
        - 'use text format basic_html'
        - 'use text format comark'
        - 'use vercel ai sdk chat'
        - 'view any unpublished content'
        - 'view kb_page revisions'
        - 'view latest version'
        - 'view media'
        - 'view the administration theme'
    user.role.collab_server:
      grantPermissions:
        - 'access content'
        - 'edit any kb_page content'
        - 'update space content'
        - 'use client registration api'
        - 'use collaboration api'
        - 'use editorial transition create_new_draft'
        - 'use inline comments api'
        - 'use text format comark'
        - 'view any unpublished content'
        - 'view kb_page revisions'
        - 'view latest version'
        - 'view space content'
    user.settings:
      simpleConfigUpdate:
        langcode: en
        anonymous: Anonymous
        verify_mail: true
        notify:
          cancel_confirm: true
          password_reset: true
          status_activated: true
          status_blocked: false
          status_canceled: false
          register_admin_created: true
          register_no_approval_required: true
          register_pending_approval: true
        register: admin_only
        cancel_method: user_cancel_block
        password_reset_timeout: 86400
        password_strength: true
