ai_assistant_api.ai_assistant.*.third_party.ai_rag_cite:
  type: mapping
  label: 'Grounding'
  mapping:
    grounding:
      type: mapping
      label: 'Grounding'
      mapping:
        mode:
          type: string
          label: 'How strictly an answer has to be grounded'
          constraints:
            Choice:
              - grounded
              - strict
        retriever:
          type: string
          label: 'The retriever plugin the sources come from'
        retriever_settings:
          type: ai_rag_cite.retriever.[%parent.retriever]
          label: 'Retriever settings'
        score_gate:
          type: mapping
          label: 'Score gate'
          mapping:
            value:
              type: float
              label: 'The score a source has to reach'
        min_sources:
          type: integer
          label: 'How many sources have to clear the gate for the turn to be answerable'
          constraints:
            Range:
              min: 1
        max_sources:
          type: integer
          label: 'How many sources the model is offered at most'
          constraints:
            Range:
              min: 1
        max_per_entity:
          type: integer
          label: 'How many passages of one page the model is offered at most'
          constraints:
            Range:
              min: 1
        citation_contract:
          type: text
          label: 'The rules appended to the assistant''s system prompt'
        no_answer_message:
          type: label
          label: 'What is answered when nothing was retrieved'
        extra_guidance:
          type: text
          label: 'Site-specific wording appended after the contract'
        ground_explorer_calls:
          type: boolean
          label: 'Whether the API Explorer''s own chat calls are grounded as this assistant''s'

ai_rag_cite.retriever.search_api_index:
  type: mapping
  label: 'Search API index retriever'
  mapping:
    index:
      type: string
      label: 'The index the question is run against'
    top_k:
      type: integer
      label: 'How many candidates one retrieval answers'
    meta_field:
      type: string
      label: 'The indexed field shown next to a source''s title'
    excerpt_field:
      type: string
      label: 'The indexed field the model reads a source from'
