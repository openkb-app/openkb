config:
  # The modules above ship their own copy of the simple config in
  # config/; the recipe overrides it as they install. Strict would
  # refuse the difference instead.
  strict: false
  actions:
    administerusersbyrole.settings:
      simpleConfigUpdate:
        roles:
          site_manager: safe
          collab_server: unsafe
    ai.settings:
      simpleConfigUpdate:
        prompt_logging: false
        prompt_logging_tags: ''
        default_providers:
          chat:
            provider_id: openai
            model_id: gpt-6-luna
          embeddings:
            provider_id: openai
            model_id: text-embedding-3-small
        default_vdb_provider: opensearch
        request_timeout: 60
        allowed_hosts: {  }
        allowed_hosts_rewrite_links: false
        global_guardrails:
          - prompt_safety_security
    ai_provider_anthropic.settings:
      simpleConfigUpdate:
        api_key: anthropic_env
        openai_moderation: true
        version: '20240229'
    ai_provider_mistral.settings:
      simpleConfigUpdate:
        api_key: mistral_env
        host: ''
    ai_provider_openai.settings:
      simpleConfigUpdate:
        api_key: openai_env
        moderation: true
        host: ''
    file.settings:
      simpleConfigUpdate:
        description:
          type: textfield
          length: 128
        icon:
          directory: core/modules/file/icons
        make_unused_managed_files_temporary: true
        filename_sanitization:
          transliterate: true
          replace_whitespace: true
          replace_non_alphanumeric: true
          deduplicate_separators: false
          lowercase: false
          replacement_character: '-'
    jsonapi.settings:
      simpleConfigUpdate:
        read_only: false
        maintenance_header_retry_seconds:
          min: 5
          max: 10
    jsonapi_role_access.settings:
      simpleConfigUpdate:
        negate: false
        roles:
          authenticated: authenticated
    lupus_decoupled_site_info.settings:
      simpleConfigUpdate:
        expose:
          - 'system.site:name'
          - 'system.site:slogan'
          - 'system.site:mail'
        permissions:
          - 'create openkb_space'
          - 'create kb_page content'
          - 'access administration pages'
          - 'invite users'
    mail_login.settings:
      simpleConfigUpdate:
        mail_login_enabled: 1
        mail_login_case_sensitive: 0
        mail_login_email_only: 0
        mail_login_override_login_labels: 1
        mail_login_username_title: 'Email address'
        mail_login_username_description: ''
        mail_login_email_only_title: 'Log in by email address'
        mail_login_email_only_description: 'You can use your email address only to log in.'
        mail_login_password_only_description: 'Enter the password that accompanies your email address.'
        mail_login_password_reset_username_title: 'Email address'
        mail_login_password_reset_username_description: 'Password reset instructions will be sent to your registered email address.'
        mail_login_password_reset_email_only_title: 'Email address'
        mail_login_password_reset_email_only_description: 'Password reset instructions will be sent to your registered email address.'
    mailsystem.settings:
      simpleConfigUpdate:
        theme: openkb_mail_theme
        defaults:
          sender: symfony_mailer_lite
          formatter: symfony_mailer_lite
        modules:
          symfony_mailer_lite:
            none:
              sender: symfony_mailer_lite
              formatter: symfony_mailer_lite
          easy_email:
            none:
              sender: symfony_mailer_lite
              formatter: symfony_mailer_lite
    mcp_server.settings:
      simpleConfigUpdate:
        langcode: en
        server_name: OpenKB
        server_version: 1.0.0
        server_instructions: |-
          Access to OpenKnowledgebase (openKB): pages of comark markdown, kept in spaces.
        
          ## Spaces and access
          Content lives in spaces, and a space is an access boundary. Call tool_api__list_spaces to see which ones you may work in and what you may do in each. The first segment of a page path is its space slug.
          When you connect, call tool_api__list_assignments: it answers the comment threads people handed to you while you were away.
        
          ## Finding and reading pages
          - tool_api__search_pages finds pages, and only pages you may read. It reads the published index, so unfinished work is found with tool_api__find_drafts instead.
          - There are two reads and they are not interchangeable. tool_api__get_page answers the page as it stands PUBLISHED: that is what to answer a question from and what to cite. getPageForEditing answers the WORKING COPY, which is what an edit is based on.
          - To cite a block in a page you write, copy the `nid` and `block` a tool answered into `:citation{nid="…" block="…"}`. Name the block: a citation of a whole page, `:citation{nid="…"}`, is the exception. Cite an external source as `:citation{url="https://…"}`.
          - To find out what a page used to say, list its revisions with tool_api__list_revisions, read every version of one block with tool_api__get_block_history, and find the revision a wording was added or removed in with tool_api__search_history.
        
          ## Creating a page
          - Call tool_api__list_spaces with access="write" and create only into a space it returns.
          - Call tool_api__create_page with a title and that space's slug. Pass `parent` (a page path of the same space) to place the new page under it in the page tree.
          - It answers with the path it generated and the id of the one placeholder block the new page holds, which your first updateBlocks replaces.
        
          ## Editing a page
          To change an existing page, use updateFields for frontmatter fields and updateBlocks for prose, naming the blocks you mean to change by the `{#b-…}` ids getPageForEditing returns. Both edit inside the page's collaborative session, so a human editing the same page sees your changes as you make them. Writes go to the page's draft, never straight to the published page, so an edit loop reads its own work back with getPageForEditing: getPageForEditing → updateBlocks → getPageForEditing.
        
          Always send `expect` on every updateBlocks op: the block version getPageForEditing's `versions` map reported. Somebody may be editing the same page right now, and `expect` is what keeps you from silently overwriting them. A refused call answers `conflicts`, naming which blocks moved and what they hold now: re-apply your edit to that markdown and call again with the version it reported. A refusal costs one call and needs no read, so write on the version you have rather than re-reading to be sure. A call that succeeds reports the same for what it wrote: `applied.blocks` maps every block it changed to the version it holds now, a block you inserted under the id minted for it. That is the `expect` your next edit to that block sends. Chain edits on it; only read the page again when you need content you do not already have.
        
          Your first write puts you in the page as a peer and you stay there while you keep working, so the blocks your last write touched are marked as yours for whoever has the page open. You do not announce that separately, and it reserves nothing. `observers` counts the humans connected in browsers, never you: above zero means somebody is in the page with you, so keep edits small and expect them to move under you. `entry` says whether your session found the page already open ("joined") or opened it ("started").
        
          ## Working beside people
          To work on a page WHILE somebody edits it, loop on waitForChanges: it answers the moment the session moves and hands you a cursor to resume from, so you react to what a person does rather than re-reading the page. Act on `comments` addressed to you: read the thread, make the change, then answer it with commentOnBlock. Act on `blocks` only where your instructions say to. A `session` event means the page's editing session closed: it ends the wait on that page.
        
          ## Asking people
          - What you need from a person (a decision, a missing fact or source): a commentOnBlock thread on its block, with a concrete suggestion. No open-points or todo list in the page, unless the person asks for one or it is content (e.g. a runbook checklist).
          - Facts you can check and corrections go straight into the block.
        
          ## Review
          tool_api__list_spaces reports the review steps a space runs: `agent_review` (a human signs off every block you write; on by default, wiki-style spaces too) and `moderated` (peer sign-off, four-eyes). When your writing is done:
          1. Read `status` from getPageForEditing for each page you wrote.
          2. Ask before you stop. Where a review step applies, tell the user the pages are ready for review, each by its path with its `blocks_pending`, and ask whether to wait for review feedback. Where none applies, tell the user the pages are drafts for an editor to publish.
          3. On a yes, loop on waitForChanges as described above, one call per page in turn, each with its own cursor and a short `timeoutSec`; a round is one call on every page still waited on. A `session` event ends the wait on that page. Stop when no page is left, after ten rounds in a row with no event, or when the user interrupts. On a no, stop: the pages wait as drafts.
        
          Reading `status`: `draft_exists` true means the working copy holds changes that are not live yet; a never-published page reads true in a wiki space and false in a moderated one. `blocks_pending` counts the blocks still waiting for a human sign-off; above zero, the page cannot publish yet. `pending` names each one: the block, the kind of change, who it waits on (`by`, empty when no writer was witnessed) and the step it owes; name them when you report. `can_publish` answers for the account you act for and can be true; you still do not publish, you tell the user the page is ready for an editor.
        
          ## Do not
          - Do not publish. No tool does: publishing is an editor's decision.
          - Do not create a page in a space tool_api__list_spaces did not report as writable. A space is never created as a side effect of a page write.
          - Do not send an updateBlocks op without `expect`, unless it names no block.
          - Do not write into a block `presence` says somebody is in.
          - Do not resolve a comment thread a person opened; the editor who raised the point closes it.
        pagination_limit: 50
        pending:
          poll_interval_ms: 300
          sampling_timeout: 25
          elicitation_timeout: 600
    node.settings:
      simpleConfigUpdate:
        use_admin_theme: true
    openkb_agent_registration.settings:
      simpleConfigUpdate:
        enabled: true
        scopes:
          - agent_read
          - agent_write
    openkb_search.settings:
      simpleConfigUpdate:
        chunk_index: kb_chunks
        vector_floor: 0.75
        query:
          lexical_bytes: 250
          embed_bytes: 8000
        chunk:
          target_tokens: 300
          max_tokens: 500
    openkb_tools.settings:
      simpleConfigUpdate:
        search:
          top_k: 10
        session_endpoint: ''
    simple_oauth.settings:
      simpleConfigUpdate:
        scope_provider: dynamic
        token_cron_batch_size: 0
        public_key: 'private://simple_oauth/public.key'
        private_key: 'private://simple_oauth/private.key'
        disable_openid_connect: false
    simple_oauth_personal_consumers.settings:
      simpleConfigUpdate:
        scopes:
          - agent_read
          - agent_write
        unclaimed_retention: 604800
    system.file:
      simpleConfigUpdate:
        allow_insecure_uploads: false
        default_scheme: public
        temporary_maximum_age: 21600
    system.mail:
      simpleConfigUpdate:
        interface:
          default: php_mail
        mailer_dsn:
          scheme: sendmail
          host: default
          user: null
          password: null
          port: null
          options: {  }
    system.theme:
      simpleConfigUpdate:
        admin: claro
        default: stark
    system.theme.global:
      simpleConfigUpdate:
        favicon:
          mimetype: image/vnd.microsoft.icon
          path: ''
          url: ''
          use_default: true
        features:
          comment_user_picture: true
          comment_user_verification: true
          favicon: true
          node_user_picture: true
        logo:
          path: ''
          url: null
          use_default: true
    trash.settings:
      simpleConfigUpdate:
        enabled_entity_types:
          node:
            - kb_page
        auto_purge:
          enabled: true
          after: '30 days'
        compact_overview: false
    update.settings:
      simpleConfigUpdate:
        check:
          disabled_extensions: false
          interval_days: 1
        fetch:
          url: null
          max_attempts: 2
          timeout: 30
        notification:
          emails: {  }
          threshold: security
    user.role.anonymous:
      grantPermissions:
        - 'access content'
        - 'restful get rest_menu_item'
        - 'use text format restricted_html'
    user.role.authenticated:
      grantPermissions:
        - 'access content'
        - 'access mcp server'
        - 'access user profiles'
        - 'change own username'
        - 'create kb_page content'
        - 'create openkb_space'
        - 'create url aliases'
        - 'delete own files'
        - 'delete own kb_page content'
        - 'edit any kb_page content'
        - 'grant simple_oauth codes'
        - 'invite users'
        - 'manage own personal consumers'
        - 'restful get lupus_decoupled_site_info'
        - 'restful get rest_menu_item'
        - 'use editorial transition create_new_draft'
        - 'use editorial transition publish'
        - 'use editorial transition submit_for_review'
        - 'use text format basic_html'
        - 'use text format comark'
        - 'use vercel ai sdk chat'
        - userprotect.account.edit
        - userprotect.pass.edit
        - 'view any unpublished content'
        - 'view kb_page revisions'
        - 'view latest version'
    user.role.collab_server:
      grantPermissions:
        - 'access content'
        - 'edit any kb_page content'
        - 'update space content'
        - 'use client registration api'
        - 'use collaboration api'
        - 'use editorial transition create_new_draft'
        - 'use inline comments api'
        - 'use text format comark'
        - 'view any unpublished content'
        - 'view kb_page revisions'
        - 'view latest version'
        - 'view space content'
    user.role.site_manager:
      grantPermissions:
        - 'access administration pages'
        - 'access navigation'
        - 'access site reports'
        - 'access users overview'
        - 'administer guardrail sets'
        - 'administer guardrails'
        - 'cancel users by role'
        - 'create users'
        - 'edit users by role'
        - 'role-assign users by role'
        - 'select account cancellation method'
        - 'view the administration theme'
        - 'view users by role'
    user.settings:
      simpleConfigUpdate:
        langcode: en
        anonymous: Anonymous
        verify_mail: true
        notify:
          cancel_confirm: true
          password_reset: true
          status_activated: true
          status_blocked: false
          status_canceled: false
          register_admin_created: true
          register_no_approval_required: true
          register_pending_approval: true
        register: admin_only
        cancel_method: user_cancel_block
        password_reset_timeout: 86400
        password_strength: true
