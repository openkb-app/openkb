        # Reviewing agent edits {#b-a923fdce}

        ## Goal {#b-3c749099}

        Sign off a block an agent wrote, so the page can be published. {#b-22718f46}

        ## How an agent edit looks {#b-48eafec7}

        An agent writes into the page's draft, never onto the live page. In the editor, every block it wrote shows the pill "Pending agent review" in the margin. On the read page, the block card (the ⓘ sign) shows "Agent review" with "Awaiting sign-off". The "Publish" button is greyed, and its tooltip says how many changes are waiting. {#b-53f850ec}

        ## Steps {#b-417e7280}

        ::block{#b-d71c33f4}
        1. Open the page in the editor and click "Review" in the header. The pane lists the agent's blocks under "Waiting on a human to read what the agent wrote".
        2. Click a row to jump to the block and read it.
        3. Click the checkmark next to the pill, "Sign off the agent write".
        4. When every block is signed off, click "Publish".
        ::

        Any person who may write in the space may sign off an agent's block, including the person the agent works for. This is not a four-eyes step: it asks for a person, not for a second one. In a space with "Review before publishing" on, the block also waits for the peer review by someone else, and shows two pills. {#b-de5af5ee}

        To skip this step in a space, turn off "Agent edits need a human sign-off" in the space settings. See [Review policy per space](/openkb-user-guide/review-policy). {#b-5071080d}

        ## Related topics {#b-8f12b099}

        ::block{#b-49667a7a}
