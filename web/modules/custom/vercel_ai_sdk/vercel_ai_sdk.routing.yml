vercel_ai_sdk.chat:
  path: '/vercel-ai/chat'
  defaults:
    _controller: '\Drupal\vercel_ai_sdk\Controller\ChatController::stream'
    _title: 'Vercel AI SDK chat'
  methods: [POST]
  requirements:
    _permission: 'use vercel ai sdk chat'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE
