name: 'OpenKB install state'
description: >-
  The applied result of the openkb_recipes at
  f9892d2d68bafadb7423089a2fb3bdf4530eaa89:
  every module and theme the production recipe set installs, and the
  configuration it leaves behind. Generated by
  scripts/build-install-state.sh — not edited by hand.
type: 'Site'
install:
  - ai
  - ai_api_explorer
  - ai_assistant_api
  - ai_provider_amazeeio
  - ai_provider_openai
  - ai_rag_cite
  - ai_search
  - ai_vdb_provider_opensearch
  - automated_cron
  - basic_auth
  - block
  - block_content
  - ckeditor5
  - claro
  - comark
  - config
  - consumers
  - content_moderation
  - contextual
  - custom_elements
  - custom_elements_ui
  - datetime
  - dblog
  - dynamic_page_cache
  - editor
  - field
  - field_ui
  - file
  - filter
  - help
  - image
  - inline_comment
  - inline_form_errors
  - jsonapi
  - key
  - layout_builder
  - layout_discovery
  - link
  - lupus_ce_renderer
  - lupus_decoupled
  - lupus_decoupled_ce_api
  - lupus_decoupled_cors
  - lupus_decoupled_form
  - lupus_decoupled_layout_builder
  - lupus_decoupled_menu
  - lupus_decoupled_site_info
  - lupus_decoupled_user_form
  - lupus_decoupled_views
  - mcp_server
  - mcp_server_tool_bridge
  - media
  - media_library
  - menu_link_content
  - menu_ui
  - metatag
  - monitoring
  - mysql
  - navigation
