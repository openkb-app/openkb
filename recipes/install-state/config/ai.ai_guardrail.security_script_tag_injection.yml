langcode: en
status: true
dependencies: {  }
id: security_script_tag_injection
label: 'Security: Script Tag Injection'
description: 'Detects attempts to inject <script> tags into prompts. Relevant when AI output is rendered in a browser context such as CKEditor or a content field.'
guardrail: regexp_guardrail
guardrail_settings:
  regexp_pattern: '/<\s*script[\s>]/i'
  violation_message: 'This message was blocked because it contains potentially malicious content.'
