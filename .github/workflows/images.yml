# Builds the two images from this checkout, brings the stack up once and
# installs the site on it, and publishes them on a push to `1.x` and on a
# version tag.
#
# - Pull requests: build, start, wait for both healthchecks,
#   `openkb-install`, check the site answers, tear down. Nothing is pushed.
# - Push to `1.x`: the same smoke run, then the base-image provenance check
#   and an amd64 development image, tagged `1.x` and `sha-<short>`.
# - Tag `vX.Y.Z`, or a manual run naming one: the same, pushed for amd64 and
#   arm64 under the semver tags, plus a release entry carrying the version's
#   `CHANGELOG.md` section.
#
# `inputs.version` is the tag a manual run publishes; it is empty on every
# other event, and an empty `ref` checks out the event's own ref.

name: images

on:
  pull_request:
  push:
    branches: ['1.x']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: >-
          An existing tag to publish again, e.g. v1.2.3. This workflow only
          re-publishes a tag; cut a new one with the release workflow.
        required: true

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Without it the checkout fails three fetch retries down, saying nothing.
      - name: Check the tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$VERSION" > /dev/null || {
            echo "Tag $VERSION does not exist — cut it with the release workflow first; this workflow only re-publishes an existing tag." >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # OpenSearch refuses to start below this.
      - run: sudo sysctl -w vm.max_map_count=262144

      - name: Write .env
        run: |
          # A self-hosted stack names the two public hostnames here, and they
          # resolve inside the containers too. The job has no DNS, so the two
          # URLs are the service names: `openkb-install` reaches the Nuxt
          # sidecar under DRUPAL_FRONTEND_BASE_URL from the drupal container.
          # The published ports are what this job's own curl uses.
          cat > .env <<EOF
          DRUPAL_BASE_URL=http://drupal:8080
          DRUPAL_FRONTEND_BASE_URL=http://frontend:3000
          SESSION_COOKIE_DOMAIN=
          DRUPAL_HASH_SALT=smoke-test-only-not-a-secret
          MARIADB_PASSWORD=smoke
          MARIADB_ROOT_PASSWORD=smoke
          OKB_COLLAB_CLIENT_ID=smoke
          OKB_COLLAB_CLIENT_SECRET=smoke-test-only-not-a-secret
          ADMIN_PASSWORD=smoke-test-only-not-a-secret
          OPENKB_TAG=smoke
          OPENKB_REVISION=${GITHUB_SHA}
          OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
          EOF

      - name: Build images
        run: docker compose build --pull

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the healthchecks
        run: |
          for i in $(seq 1 60); do
            drupal=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q drupal)")
            frontend=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q frontend)")
            echo "drupal=$drupal frontend=$frontend"
            [ "$drupal" = healthy ] && [ "$frontend" = healthy ] && exit 0
            sleep 5
          done
          echo "The stack did not become healthy." >&2
          exit 1

      - name: Install the site
        run: docker compose exec -T drupal openkb-install

      - name: Check the site answers
        run: |
          # The schema the frontend fetches anonymously: 200 only from an
          # installed site whose anonymous role can read.
          status=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/openkb/schema)
          [ "$status" = 200 ] || { echo "/openkb/schema answered $status" >&2; exit 1; }
          docker compose exec -T drupal drush core:status --field=bootstrap | grep -qx Successful
          docker compose exec -T drupal drush pm:list --status=enabled --field=name | grep -qx openkb_space

      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ADR 0018: the base is not a Docker Official Image, so the pipeline proves
  # it was built by php/frankenphp before anything is published — one gate for
  # everything that is pushed, so only a pull request skips it.
  verify-base:
    if: github.event_name != 'pull_request'
    needs: build-and-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the FrankenPHP base image
        run: |
          digest=$(sed -n 's#^FROM dunglas/frankenphp:[^@]*@\(sha256:[0-9a-f]\{64\}\).*#\1#p' docker/drupal/Dockerfile)
          [ -n "$digest" ] || { echo "docker/drupal/Dockerfile pins no frankenphp digest" >&2; exit 1; }
          cosign verify-attestation --new-bundle-format --type https://slsa.dev/provenance/v1 \
            --certificate-identity-regexp '^https://github.com/php/frankenphp/\.github/workflows/docker\.yaml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "docker.io/dunglas/frankenphp@$digest" > /dev/null

  # Skipped with verify-base on a pull request.
  publish:
    needs: [build-and-smoke, verify-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [drupal, frontend]
    env:
      # The development image off the branch; anything else is a release.
      BRANCH_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/1.x' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      # arm64 is cross-built; the runner is amd64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pre-release tag (v1.0.0-beta.1) collapses every pattern onto its
      # exact version and leaves `latest` unset — the action's own rule. On a
      # branch build the semver patterns yield nothing (they need a tag ref or
      # a `value`), so it carries `1.x` and `sha-<short>` and no `latest`.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/openkb-app/openkb-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
            type=ref,event=branch,enable=${{ env.BRANCH_BUILD }}
            type=sha,enable=${{ env.BRANCH_BUILD }}

      # The context and Dockerfile docker-compose.yml builds with.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          # The development image is amd64 only; a release carries both.
          platforms: ${{ env.BRANCH_BUILD == 'true' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.checkout.outputs.commit }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/openkb-app/openkb-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The release entry for a version tag: the version's CHANGELOG.md section as
  # notes, plus how to run it. A manual run re-publishing a tag updates the
  # entry it already has.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false

      - name: Take the version's section out of CHANGELOG.md
        run: |
          version=${TAG#v}
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; print; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > notes.md || {
            echo "CHANGELOG.md holds no '## [$version]' section. The release workflow writes it; $TAG was not cut with it." >&2
            exit 1
          }
          {
            printf '\n## Run it\n\n'
            printf '```sh\n'
            printf 'OPENKB_TAG=%s\n' "$version"
            printf 'docker compose pull && docker compose up -d\n'
            printf 'docker compose exec drupal openkb-install   # first run only; it destroys an existing site\n'
            printf '```\n'
            case $version in
              *-*) printf '\nA pre-release: run it on a throwaway site, not on data you keep.\n' ;;
            esac
          } >> notes.md
          cat notes.md

      - name: Create or update the release
        run: |
          case $TAG in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --prerelease="$prerelease"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md --prerelease="$prerelease"
          fi
