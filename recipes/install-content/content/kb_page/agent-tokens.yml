        # Agent tokens {#b-85c33b75}

        ## Goal {#b-227e55d9}

        Give an agent that cannot open a browser, such as a script or a scheduled job, its own credentials. {#b-972d7c31}

        ## Prerequisites {#b-70b1e38e}

        An ordinary account. The token acts as this account. {#b-80efaea6}

        ## Steps {#b-167153c9}

        ::block{#b-383432d0}
        1. Open the account menu and choose "Agents & API clients".
        2. Under "Provision a token", enter a name for the client and click "Create API client".
        3. Copy the "Client ID" and the "Client secret". The secret is shown once, on this page only.
        4. Give both to the agent. It exchanges them at `/oauth/token` on the administration host for a short-lived access token (the client credentials grant), and sends that token as a bearer token to the `/api/mcp` endpoint.
        ::

        ## Revoking {#b-14bc3319}

        Click "Revoke" next to the client under "Your clients" and confirm. Existing tokens stop working and no new ones are issued. {#b-3bf5ee03}

        ## Related topics {#b-5953fc72}

        ::block{#b-345f1cec}
        - [Connect an agent by URL](/openkb-user-guide/connect-an-agent): the path for a client with a browser.
        - [Agents as users](/openkb-user-guide/agents-as-users)
        ::
