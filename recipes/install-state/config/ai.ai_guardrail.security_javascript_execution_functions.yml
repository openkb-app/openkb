langcode: en
status: true
dependencies: {  }
id: security_javascript_execution_functions
label: 'Security: JavaScript Execution Functions'
description: 'Detects common JavaScript execution patterns such as eval(), setTimeout(), and document.write() that may appear in prompt injection attempts targeting agentic workflows with code execution tools.'
guardrail: regexp_guardrail
guardrail_settings:
  regexp_pattern: '/\b(eval|setTimeout|setInterval|document\.write|document\.cookie)\s*\(/i'
  violation_message: 'This message was blocked because it contains potentially malicious content.'
