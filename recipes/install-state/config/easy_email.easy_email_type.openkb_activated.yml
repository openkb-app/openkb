    <p>[easy_email:recipient_uid:0:entity:display-name],</p>
    <p>Your account at [site:name] has been activated.</p>
    <p>You may now log in by clicking this link:</p>
    <table class="button" role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td>
          <a href="[easy_email:recipient_uid:0:entity:one-time-login-url]">Log in and set your password</a>
        </td>
      </tr>
