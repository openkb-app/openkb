        # Keyboard shortcuts {#b-463f9e0f}

        ## Goal {#b-5f665165}

        Know where the complete list of keys and typed triggers lives, and the few you need on day one. {#b-03f5e73d}

        The app keeps its own list at [Shortcuts](/help/shortcuts). Open it from the account menu at the bottom of the sidebar, or from the "More" menu on any page. It lists the keyboard shortcuts, the typed triggers and the Markdown the editor converts as you type. It is always current. {#b-5443fcfe}

        ## The ones to start with {#b-8803e36b}

        The modifier is ⌘ on a Mac and Ctrl everywhere else. {#b-40a64f14}

        ::block{#b-73362b63}
        - Ctrl+K: go to search, with the cursor in the search box.
        - Ctrl+J: open or close the assistant.
        - In the editor, type `/` to open the block menu.
        - In the editor, type `[[` to link to another page.
        - In the editor, type `@` to mention a person.
        - Escape leaves a picker and keeps what you typed as text.
        ::

        ## Related topics {#b-f378ce2b}

        ::block{#b-74af157e}
