# Daily checks of the images, each a job that fails on findings:
# - `scan`: the published `openkb-drupal` and `openkb-frontend`, each at `1.x`
#   and at the newest release, for fixed HIGH and CRITICAL vulnerabilities and
#   for secrets. Findings: a table per image in the run summary, and SARIF in
#   code scanning.
# - `base images`: the FrankenPHP and Node pins of `1.x` against upstream
#   security releases, which Trivy does not see. Findings: a table in the run
#   summary; dependabot brings the bump.
#
# The red run is the alert, posted to Slack by the GitHub app's subscription to
# this workflow.

name: Image scan

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The newest published release, pre-releases included; its images drop the `v`.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" --jq '[.[] | select(.draft | not)][0].tag_name // empty')
          [ -n "$tag" ] || { echo "No release found." >&2; exit 1; }
          echo "tag=${tag#v}" >> "$GITHUB_OUTPUT"

  scan:
    needs: release
    name: ${{ matrix.image }}:${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [openkb-drupal, openkb-frontend]
        tag: ['1.x', '${{ needs.release.outputs.tag }}']
    env:
      IMAGE: ghcr.io/openkb-app/${{ matrix.image }}:${{ matrix.tag }}
    steps:
      # The fixtures of core's package_manager tests: a fake vendor dir with
      # pinned vulnerable versions, never loaded.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: app/web/core/modules/package_manager/tests/fixtures
          format: json
          output: trivy.json
          hide-progress: true

      - name: Summary
        run: |
          {
            echo "## \`$IMAGE\`"
            jq -r '
              def table(head; rows): if rows | length == 0 then empty else
                head, (head | gsub("[^|]+"; "---")), rows[] end;
              ([.Results[]? | .Target as $target | .Vulnerabilities[]?
                | {s: .Severity, row: "| \(.PkgName) | \(.InstalledVersion) → \(.FixedVersion) | \(if .PrimaryURL then "[\(.VulnerabilityID)](\(.PrimaryURL))" else .VulnerabilityID end) | \(.Severity) | `\(.PkgPath // $target)` |"}]
                | sort_by(.s != "CRITICAL") | map(.row)) as $vulns
              | [.Results[]? | .Target as $target | .Secrets[]?
                | "| \(.RuleID) | \(.Severity) | `\($target):\(.StartLine)` |"] as $secrets
              | if ($vulns + $secrets | length) == 0 then "No findings." else
                  table("| Package | Installed → fixed | Vulnerability | Severity | In |"; $vulns),
                  "",
                  table("| Secret | Severity | In |"; $secrets)
                end
            ' trivy.json
          } >> "$GITHUB_STEP_SUMMARY"

      - run: trivy convert --format sarif --output trivy.sarif trivy.json

      # One category per image and track, so a new release replaces the
      # previous one's alerts.
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.image }}-${{ matrix.tag == '1.x' && '1.x' || 'release' }}

      - name: Fail on findings
        run: |
          count=$(jq '[.Results[]? | (.Vulnerabilities // []) + (.Secrets // []) | .[]] | length' trivy.json)
          [ "$count" = 0 ] || { echo "$IMAGE: $count findings, listed in the run summary." >&2; exit 1; }

  # - FrankenPHP: its advisories are repository advisories on php/frankenphp,
  #   and the binary carries no `github.com/dunglas/frankenphp` version.
  # - Node: the newest security release of the pinned major line.
  base-images:
    name: base images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the pins against upstream security releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # newer A B: A is a later version than B.
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }

          frankenphp=$(sed -n 's#^FROM dunglas/frankenphp:\([0-9][0-9.]*\)-.*#\1#p' docker/drupal/Dockerfile)
          node=$(sed -n 's#^FROM node:\([0-9][0-9.]*\)-.*#\1#p' docker/frontend/Dockerfile)
          [ -n "$frankenphp" ] || { echo "docker/drupal/Dockerfile pins no frankenphp version" >&2; exit 1; }
          [ -n "$node" ] || { echo "docker/frontend/Dockerfile pins no node version" >&2; exit 1; }

          rows=()
          # One line per advisory: id, severity, its patched versions.
          while IFS=$'\t' read -r id severity patched; do
            first=$(tr ' ' '\n' <<< "$patched" | sort -V | head -n 1)
            newer "$first" "$frankenphp" || continue
            rows+=("| openkb-drupal: FrankenPHP | $frankenphp | $first | [$id](https://github.com/php/frankenphp/security/advisories/$id) ($severity) |")
          done < <(gh api --paginate "repos/php/frankenphp/security-advisories?state=published&per_page=100" \
            --jq '.[] | [.ghsa_id, .severity, ([.vulnerabilities[].patched_versions // empty | split(",")[] | ltrimstr(" ") | ltrimstr(">=") | ltrimstr(" ") | ltrimstr("v")] | join(" "))] | @tsv')

          release=""
          while IFS=$'\t' read -r tag url; do
            newer "${tag#v}" "$node" || continue
            if [ -z "$release" ] || newer "${tag#v}" "${release%%$'\t'*}"; then release="${tag#v}"$'\t'"$url"; fi
          done < <(gh api "repos/nodejs/node/releases?per_page=50" \
            --jq ".[] | select(.tag_name | startswith(\"v${node%%.*}.\")) | select(.body // \"\" | ascii_downcase | contains(\"security release\")) | [.tag_name, .html_url] | @tsv")
          if [ -n "$release" ]; then
            rows+=("| openkb-frontend: Node | $node | ${release%%$'\t'*} | [security release](${release#*$'\t'}) |")
          fi

          {
            echo "## Base images"
            if [ "${#rows[@]}" = 0 ]; then
              echo "No security release newer than FrankenPHP $frankenphp and Node $node."
            else
              echo "| Image | Pinned | Newer | Advisory |"
              echo "| --- | --- | --- | --- |"
              printf '%s\n' "${rows[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${#rows[@]}" = 0 ] || { echo "Base images: ${#rows[@]} upstream security fixes newer than the pins, listed in the run summary." >&2; exit 1; }
