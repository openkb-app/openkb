# One GROUPED update per ecosystem and one per base image, so at most 6
# dependency PRs are open at once — dependabot maintains the collective PR and
# CI tests it as one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    # A TypeScript major changes the compiler API @vue/compiler-sfc drives to
    # resolve imported prop types, which breaks `nuxt build` on every SFC using
    # `defineProps<ImportedType>()` — keep it off the grouped PR so it lands
    # with its own compiler-sfc / plugin-vue round.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tests/playwright
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      e2e-deps:
        patterns: ["*"]
  - package-ecosystem: composer
    directories:
      - /
      - /openkb
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      php-deps:
        patterns: ["*"]
  # The base images are pinned as version@digest. Minor and patch releases and
  # re-pushed digests move here; a major or a PHP line (8.4) is a decision.
  # - One PR per image directory: a hand bump of one pin closes only that
  #   image's PR.
  # - Daily: a closed PR comes back the next day, not the next week.
  - package-ecosystem: docker
    directories:
      - /docker/drupal
      - /docker/frontend
    schedule:
      interval: daily
    # Base-image releases are security releases; the default 3-day cooldown delays them.
    cooldown:
      default-days: 0
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # The service images of the compose files, by exact version. MariaDB stays
  # on its 11.4 LTS line.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /quickstart
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mariadb"
        update-types: ["version-update:semver-minor"]
    groups:
      compose-images:
        patterns: ["*"]
