vercel_ai_sdk_mock.settings:
  type: config_object
  label: 'Chat mock'
  mapping:
    mode:
      type: string
      label: 'What an answer is made of'
      constraints:
        Choice:
          - canned
          - scripted
    delay_ms:
      type: integer
      label: 'Pause between two frames, in milliseconds'
      constraints:
        Range:
          min: 0
    answer:
      type: text
      label: 'The canned answer, with @prompt for the question'
