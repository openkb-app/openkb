# The OpenKB evaluation stack: the published images on localhost, ready to run.
# README.md next to it walks through it.
#
#   docker compose up -d
#
# - The `drupal` container installs the site on its first boot and answers with
#   a "setting up" page until it is done.
# - Self-contained: the two images are pulled, nothing is built, and every
#   setting has its value here. A `.env` beside this file is optional: its
#   lines override the values below and reach the drupal and cron containers.
# - `frontend` runs in `drupal`'s network namespace, so `http://localhost:8642`
#   and `http://localhost:8643` mean the same thing in the browser and inside
#   both containers. `drupal` publishes both ports.
# - Evaluation only: the passwords below are published with this file, so they
#   are public, and both ports stay on 127.0.0.1. A real install is the
#   project's own docker-compose.yml with .env.example; docs/self-hosting.md
#   covers it.

x-container:
  &container-defaults
    restart: unless-stopped

# The two own images run without capabilities; mariadb and opensearch drop
# privileges themselves and need theirs.
x-hardening:
  &hardening
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

x-stack-urls:
  &stack-urls
    DRUPAL_BASE_URL: ${DRUPAL_BASE_URL:-http://localhost:8643}
    DRUPAL_FRONTEND_BASE_URL: ${DRUPAL_FRONTEND_BASE_URL:-http://localhost:8642}
    OKB_COLLAB_CLIENT_ID: ${OKB_COLLAB_CLIENT_ID:-openkb-evaluation}
    OKB_COLLAB_CLIENT_SECRET: ${OKB_COLLAB_CLIENT_SECRET:-openkb-evaluation-only-not-a-secret}

services:
  drupal:
    # `latest` is the newest release; `docker compose pull` fetches a newer one.
    # OPENKB_TAG=1.2.3 in `.env` pins a version.
    image: ${OPENKB_IMAGE_PREFIX:-ghcr.io/openkb-app/openkb}-drupal:${OPENKB_TAG:-latest}
    << : [*container-defaults, *hardening]
    depends_on:
      mariadb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    # Every variable of an optional .env, so a secret such as an `*_API_KEY`
    # needs no entry here. `environment:` wins over it.
    env_file:
      - path: .env
        required: false
    environment:
      << : *stack-urls
      # The port FrankenPHP listens on, published 1:1 below so the port in
      # DRUPAL_BASE_URL holds inside the namespace too.
      SERVER_NAME: ":${DRUPAL_HTTP_PORT:-8643}"
      DRUSH_OPTIONS_URI: ${DRUPAL_BASE_URL:-http://localhost:8643}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:-openkb-evaluation-only-not-a-secret}
      # One host for both ports, so the session cookie needs no domain.
      SESSION_COOKIE_DOMAIN: ""
      OPENSEARCH_URL: http://opensearch:9200
      MARIADB_DATABASE: ${MARIADB_DATABASE:-drupal}
      MARIADB_USER: ${MARIADB_USER:-drupal}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-openkb}
      # The `admin` account's password, read by the install.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Where the install finds the recipes, which the image ships.
      OPENKB_RECIPES_DIR: /app/recipes
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:${DRUPAL_HTTP_PORT:-8643}/user/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Covers the install of a first boot, during which the setup page — a
      # 503 — is the answer.
      start_period: 10m
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${DRUPAL_HTTP_PORT:-8643}:${DRUPAL_HTTP_PORT:-8643}"
      - "${LISTEN_IP:-127.0.0.1}:${FRONTEND_HTTP_PORT:-8642}:${FRONTEND_HTTP_PORT:-8642}"
    volumes:
      # Public and private files, config sync, OAuth keys.
      - drupal-files:/app/files

  # Drupal's cron every five minutes. The same image and the same files volume,
  # serving nothing: `extends` takes drupal's settings and this drops what only
  # the serving container has. Its entrypoint installs nothing — the command is
  # not the server's.
  cron:
    extends:
      service: drupal
    # Both containers mount the same files volume; on the first start the image's
    # files are copied into it by the container that starts first, and two
    # starting at once collide on the copy.
    depends_on:
      drupal:
        condition: service_started
    command: ["supercronic", "/etc/crontabs/openkb"]
    ports: !reset []
    healthcheck:
      disable: true

  frontend:
    image: ${OPENKB_IMAGE_PREFIX:-ghcr.io/openkb-app/openkb}-frontend:${OPENKB_TAG:-latest}
    << : [*container-defaults, *hardening]
    # Drupal's namespace: the two reach each other on localhost, as the browser
    # does.
    network_mode: service:drupal
    # The shutdown flushes the collab store; give it time before SIGKILL.
    stop_grace_period: 30s
    environment:
      << : *stack-urls
      NITRO_PORT: ${FRONTEND_HTTP_PORT:-8642}
    volumes:
      # The collab snapshot store. Coupled to the database: `down -v` drops both.
      - collab-store:/app/frontend/var

  mariadb:
    image: ${OPENKB_MARIADB_IMAGE:-mariadb:11.4.13}
    << : *container-defaults
    # The isolation level Drupal asks for.
    command:
      - --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-drupal}
      MARIADB_USER: ${MARIADB_USER:-drupal}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-openkb}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-openkb}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mariadb-data:/var/lib/mysql

  opensearch:
    image: ${OPENKB_OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.10.0}
    << : *container-defaults
    environment:
      discovery.type: single-node
      # One node, so a replica has nowhere to go: it would stay unassigned and
      # hold cluster health at yellow. A default, not a cap -- an index asking
      # for replicas still gets them.
      cluster.default_number_of_replicas: "0"
      # The cluster is reachable from the stack's own network only.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      # Off, so the host needs no `sysctl vm.max_map_count=262144`. A real index
      # wants it on.
      node.store.allow_mmap: ${OPENSEARCH_ALLOW_MMAP:-false}
      # A laptop-sized heap; plan 4 GB of RAM free for the stack.
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms256m -Xmx256m}
      # Plugins to keep; everything else is removed at container start.
      #   knn               knn_vector field of the chunk index
      #   neural-search     normalization-processor of the hybrid query's search pipeline
      #   custom-codecs     index compression codecs
      #   system-templates  built-in index templates
      OPENSEARCH_PLUGINS: opensearch-knn opensearch-neural-search opensearch-custom-codecs opensearch-system-templates
    command: |
      bash -c 'for p in $$(ls plugins); do case " $$OPENSEARCH_PLUGINS " in *" $$p "*) ;; *) rm -rf plugins/$$p config/$$p bin/$$p ;; esac; done
      exec ./opensearch-docker-entrypoint.sh opensearch'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  drupal-files:
  collab-store:
  mariadb-data:
  opensearch-data:
