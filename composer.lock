        {
            "name": "drupal/openkb",
            "version": "1.x-dev",
            "source": {
                "type": "git",
                "url": "https://git.drupalcode.org/project/openkb.git",
                "reference": "8c3478ccfa760298afd4a9bf0ac07db3f103391c"
            },
            "require": {
                "drupal/ai": "^1.5.0-rc1",
                "drupal/ai_vdb_provider_opensearch": "^1.1.0-alpha2",
                "drupal/consumers": "^1.17",
                "drupal/custom_elements": "^3.5.0-beta1",
                "drupal/key": "^1.18",
                "drupal/lupus_ce_renderer": "^2.6.1",
                "drupal/lupus_decoupled": "^1.5.1",
                "drupal/mcp_server": "2.0.0-beta2",
                "drupal/pathauto": "^1.13",
                "drupal/search_api": "^1.39",
                "drupal/search_api_opensearch": "^2.5",
                "drupal/simple_oauth": "^6",
                "drupal/tool": "^1.0@beta",
                "php": ">=8.3"
            },
            "require-dev": {
                "drupal/ai_provider_openai": "^1.2.5",
                "drupal/mcp_server_tool_bridge-mcp_server_tool_bridge": "^1.0@beta"
            },
            "default-branch": true,
            "type": "drupal-module",
            "extra": {
                "patches": {
                    "drupal/ai": {
                        "OKB-309: Embed nothing for a lexical_only query. The ai_search backend embeds the query's keys before every search and only reaches a provider's vectorSearch() when it holds a vector, so a search that wants the lexical arm alone still costs an embeddings call. The option is passed through instead, and the provider answers it off the index's own text fields. drupal.org issue pending; swap for its patch once filed.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/ai_search-lexical-only-skips-the-embedding.patch"
                    },
                    "drupal/ai_vdb_provider_opensearch": {
                        "OKB-295: Map every stored field as a keyword. createCollection() declares only the vector, so the item keys and the strategy's attributes are dynamically mapped as analyzed text — no `term` filter matches one, which also leaves deleteItems() matching nothing and duplicating every chunk on reindex. drupal.org issue pending; swap for its patch once filed.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/ai_vdb_provider_opensearch-attributes-mapped-as-keywords.patch",
                        "OKB-295: Store a row under its own id, scoped by index, and delete it by the same scope, surviving a concurrent save. insertIntoCollection() mints a uniqid() for every row, so nothing a reindex writes can replace what is there; the collection belongs to the server, so the index has to be part of the id. deleteItems() then removes by drupal_entity_id alone, which takes a second index's rows for the same entity with it, and runs delete_by_query without `conflicts` or `refresh`, so a row whose version moved while another save was indexing the same page fails the whole request — a 500 on the save — and the rows it did delete are invisible to the next one. drupal.org issue pending; swap for its patch once filed.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/ai_vdb_provider_opensearch-chunk-id-as-document-id.patch",
                        "OKB-295: Answer one bool filter list from prepareFilters(). It writes the index id into the clause the condition group built, which puts either two fields in one `term` or a `term` beside a `bool`; OpenSearch rejects both, so any query carrying a condition fails. drupal.org issue pending; swap for its patch once filed.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/ai_vdb_provider_opensearch-one-bool-filter-list.patch",
                        "OKB-295: List only the provider's own collections. getCollections() answers every index in the cluster, under its prefixed name, so foreign indices are offered as collections and the names it returns cannot be passed back to createCollection() or dropCollection(). An index made before the marker is recognised by its vector field. Applies on top of the keyword-mapping patch, whose comment is in its context. drupal.org issue pending; swap for its patch once filed.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/ai_vdb_provider_opensearch-own-collections-only.patch",
                        "OKB-295: Answer the stored row on the read path. vectorSearch() narrows `_source` to the output_fields ai_search asks for — id, drupal_entity_id, drupal_long_id, content — so every attribute the embedding strategy stored is dropped before the result item is built and a consumer can neither render nor cite one. Applies on top of the collections patch. drupal.org issue pending; swap for its patch once filed.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/ai_vdb_provider_opensearch-stored-row-on-the-read-path.patch",
                        "OKB-306: Search a collection on both arms at once. vectorSearch() only ever issues a kNN clause, so a term a section spells out is unreachable unless the embedding places it near. Where a site declares an analyzed text field on the new CollectionMappingEvent, one hybrid query runs a match clause beside the kNN one, a search pipeline fuses the scores, a vector_min_score option floors the kNN arm, and highlight fragments come back on the row, marked with private-use characters no stored text carries. The match clause mirrors the parsed keys' conjunction, and an excluded key goes into the filter both arms share rather than into a clause of either. drupal.org issue pending; swap for its patch once filed.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/ai_vdb_provider_opensearch-hybrid-knn-and-match.patch",
                        "OKB-309: Run the match clause on its own where a query asks for it. vectorSearch() always issues a kNN clause, so a caller that wants the lexical arm alone — a title prefix offered while someone types, where an embedding costs a provider call and a fragment embeds to noise — has no way to ask for it. A `lexical_only` query option answers off the analyzed text fields the CollectionMappingEvent declares, with no kNN clause and no search pipeline, and its value names the OpenSearch match type (`bool_prefix` for a prefix match). Applies on top of the hybrid patch. drupal.org issue pending; swap for its patch once filed.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/ai_vdb_provider_opensearch-lexical-only-query.patch"
                    },
                    "drupal/core": {
                        "#3210926: Call to a member function getAlias on null in PathItem->postSave(). Saving a pending revision whose path field carries a pid for an alias entity that is gone fatals; the guard re-creates the alias instead. Paths are relative to the drupal repository root; composer-patches knows drupal/core takes patch depth 2.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/drupal-core-3210926-pathitem-postsave-missing-alias.patch"
                    },
                    "drupal/custom_elements": {
                        "OKB-134: Let the entity_reference formatter emit the referenced entity UUID (upstream merge pending)": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/custom_elements-entity-reference-include-uuid.patch",
                        "OKB-338: Build the library elements from the asset resolver — one call gives the files in Drupal's load order across libraries and the drupalSettings the libraries run on; the generator's own walk ordered files per library only and never minted the settings core's ajax.js and Drupal.url() read. drupal.org issue pending; swap for its patch once filed.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/custom_elements-library-elements-from-asset-resolver.patch"
                    },
                    "drupal/lupus_ce_renderer": {
                        "OKB-151: Answer a plain 3xx Response as the CE redirect payload too — a controller answering in PSR-7 (simple_oauth's /oauth/authorize) reaches the response event as a plain Response, so the class check alone lets a raw 302 leave /ce-api for a consumer's HTTP layer to follow server-side. drupal.org issue pending; swap for its patch once merged.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/lupus_ce_renderer-psr7-redirect-as-ce-payload.patch"
                    },
                    "drupal/lupus_decoupled": {
                        "#3466974: Answer configured permissions for the current user in /api/site-info, so a frontend can ask whether it may offer an action instead of rendering a page to read roles off it. Varies by the user.permissions cache context; anonymous stays one shared entry. Pending upstream, swap for its patch once merged.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/lupus_decoupled-3466974-site-info-permissions.patch"
                    },
                    "drupal/mcp_server": {
                        "#3585917, OKB-241: The SDK reads every suspension of a request handler's fiber as a payload addressed to the client, but fibers are process-wide and Drupal suspends the running one for its own scheduling, so a tools/call that loads an entity is answered as an event stream with the result nowhere in it. Against 2.0.0-beta2; drop once the fix is released upstream.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/mcp_server-shield-element-handler-from-foreign-fiber-suspends.patch"
                    },
                    "drupal/mcp_server_tool_bridge-mcp_server_tool_bridge": {
                        "OKB-201: A failed or denied call must reach the client as an error. ToolApi::execute() answers every failure with a returned array, and the SDK wraps any returned array as a successful CallToolResult, so a refusal arrives as HTTP 200 isError: false. Throwing Mcp\\Exception\\ToolCallException is the plugin's only lever on the error channel. drupal.org #3618716 (active, no MR); attach this there rather than opening a new issue.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/mcp_server_tool_bridge-failed-call-is-an-error.patch",
                        "OKB-201: Advertise a per-tool outputSchema. McpToolConfigDeriver copies outputSchema from the base plugin definition, which is always NULL, so no bridged tool describes its result. Built from the tool's own getOutputDefinitions(), describing the {success, message, data} envelope execute() answers. drupal.org issue pending.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/mcp_server_tool_bridge-output-schema-from-tool-outputs.patch",
                        "OKB-201: Take readOnlyHint and idempotentHint from the tool's ToolOperation. The deriver copies both from the base plugin definition, so every bridged tool is advertised as non-read-only and non-idempotent and a client gating writes on readOnlyHint treats a read tool as a mutation. Applies on top of the outputSchema patch. drupal.org issue pending.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/mcp_server_tool_bridge-hints-from-tool-operation.patch",
                        "OKB-201: Invalidate the tool plugin cache when an mcp_tool_config is saved or deleted. The entity invalidates mcp_server:discovery, but mcp_server's tool plugin manager caches the derived definitions under mcp_server:tools — so switching a tool on or off has no effect until the plugin caches are cleared by hand. drupal.org issue pending.": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/mcp_server_tool_bridge-invalidate-the-tool-plugin-cache.patch"
                    },
                    "drupal/simple_oauth": {
                        "OKB-73: Vary calculated permissions by the token subject's roles (drupal.org issue pending)": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/simple_oauth-token-subject-roles-cache-context.patch",
                        "OKB-75: Apply the scope intersect to the token subject computed under an ambient token (drupal.org issue pending)": "https://git.drupalcode.org/project/openkb/-/raw/1.x/patches/simple_oauth-scope-ceiling-ambient-subject.patch"
                    }
                }
            },
            "license": [
                "GPL-2.0-or-later"
            ],
            "description": "The OpenKB-specific Drupal modules (agent identity, workflow/review, JSON:API surface, revision history, spaces, outline, schema, media library).",
            "homepage": "https://www.drupal.org/project/openkb",
            "support": {
                "source": "https://github.com/openkb-app/openkb"
            },
            "time": "2026-09-23T14:27:09+00:00"
        },
