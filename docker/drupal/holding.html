<!DOCTYPE html>

<!-- The install takes a few minutes; the page reloads itself until it is over. -->
<meta http-equiv="refresh" content="10">
<title>Setting up OpenKnowledgebase…</title>
<style>
:root {
	color-scheme: light dark;
	--okb-ground: #f5f6f9;
	--okb-surface: #ffffff;
	--okb-text: #171a26;
	--okb-text-muted: #5a5f76;
	--okb-border: #e0e2ea;
}
@media (prefers-color-scheme: dark) {
	:root {
		--okb-ground: #141620;
		--okb-surface: #1d202c;
		--okb-text: #eef0f5;
		--okb-text-muted: #a3a7ba;
		--okb-border: #2c3040;
	}
}
body {
	margin: 0;
	min-height: 100svh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 24px;
	background: var(--okb-ground);
	color: var(--okb-text);
	font: 400 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main {
	max-width: 28rem;
	padding: 32px;
	border-radius: 14px;
	background: var(--okb-surface);
	box-shadow: 0 0 0 1px var(--okb-border);
	text-align: center;
}
h1 {
	margin: 20px 0 8px;
	font-size: 20px;
	letter-spacing: -0.01em;
}
p {
	margin: 0;
	color: var(--okb-text-muted);
}
</style>
</head>

<main>
	<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true"><style>.ring{fill:#4c5a9e}.leaf{fill:#10b981}@media (prefers-color-scheme:dark){.ring{fill:#a6b3d9}.leaf{fill:#34d399}}</style><mask id="m"><rect width="48" height="48" fill="white"/><circle cx="16" cy="24" r="15.5" fill="black"/></mask><rect class="leaf" x="18" y="10" width="26" height="28" rx="8" mask="url(#m)"/><circle class="ring" cx="16" cy="24" r="13"/></svg>
	<h1>Setting up OpenKnowledgebase…</h1>
