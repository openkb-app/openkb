        # Page types and tags {#b-5aca5765}

        ## Goal {#b-833253f4}

        Set a page's type, tags, summary and owner. {#b-060765be}

        ## Steps {#b-883dbf68}

        ::block{#b-14b299b3}
        1. Open the page and click "Edit".
        2. Click "Details" above the title. The form shows the page's fields. Clicking the type pill next to the title opens it too.
        3. Choose a "Type": Article, ADR, Guide or Runbook. The type is required. It shows on the page and is a filter on the search page.
        4. Add "Tags". Type to search the existing tags and pick one, or type a new one to create it. Tags show in search results.
        5. Fill in "Summary" for a one-paragraph abstract used in listings and search.
        6. Set an "Owner": the person accountable for keeping the page current.
        7. Click "Save". The fields are part of the page's draft and go live with it.
        ::

        The space is not a field here. A page is created in a space and moved with "Move to space…" in the "More" menu. {#b-947d5332}

        ## The four types {#b-b47269aa}

        ::block{#b-66dc1c85}
        - Article: the default. Anything written to be read.
        - ADR: an architecture decision record. A decision, its context and its consequences.
        - Guide: a how-to, like this page.
        - Runbook: the steps to run when something happens.
        ::

        These four are the defaults. An administrator can add or rename types, see [Customizing page types](/openkb-user-guide/customizing-page-types). {#b-70b5a919}

        ## Related topics {#b-d833114f}

        ::block{#b-2ae8941c}
