# One GROUPED update per ecosystem, so at most 4 dependency PRs are open at
# once — dependabot maintains the collective PR and CI tests it as one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    # A TypeScript major changes the compiler API @vue/compiler-sfc drives to
    # resolve imported prop types, which breaks `nuxt build` on every SFC using
    # `defineProps<ImportedType>()` — keep it off the grouped PR so it lands
    # with its own compiler-sfc / plugin-vue round.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tests/playwright
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      e2e-deps:
        patterns: ["*"]
  - package-ecosystem: composer
    directories:
      - /
      - /openkb
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      php-deps:
        patterns: ["*"]
  # The base images are pinned as tag@digest. Only the digest moves here, when
  # upstream re-pushes the tag; a tag change (PHP 8.4, Node 24) is a decision.
  - package-ecosystem: docker
    directories:
      - /docker/drupal
      - /docker/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      base-images:
        patterns: ["*"]
