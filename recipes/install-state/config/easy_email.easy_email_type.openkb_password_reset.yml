langcode: en
status: true
dependencies: {  }
id: openkb_password_reset
label: 'OpenKB: Password recovery'
key: ''
recipient: {  }
cc: {  }
bcc: {  }
fromName: ''
fromAddress: ''
replyToAddress: ''
subject: 'Replacement login information for [easy_email:recipient_uid:0:entity:display-name] at [site:name]'
inboxPreview: ''
bodyHtml:
  value: |-
    <p>[easy_email:recipient_uid:0:entity:display-name],</p>
    <p>A request to reset the password for your account has been made at [site:name].</p>
    <p>You may now log in by clicking this link:</p>
    <table class="button" role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td>
          <a href="[easy_email:recipient_uid:0:entity:one-time-login-url]">Log in and reset your password</a>
        </td>
      </tr>
    </table>
    <p>This link can only be used once to log in and will lead you to a page where you can set your password. It expires after one day and nothing will happen if it's not used.</p>
    <p>--&nbsp; [site:name] team</p>
  format: easy_email
bodyPlain: |-
  [easy_email:recipient_uid:0:entity:display-name],

  A request to reset the password for your account has been made at [site:name].

  You may now log in by clicking this link or copying and pasting it into your browser:

  [easy_email:recipient_uid:0:entity:one-time-login-url]

  This link can only be used once to log in and will lead you to a page where you can set your password. It expires after one day and nothing will happen if it's not used.

  --  [site:name] team
