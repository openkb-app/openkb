; On top of PHP's own php.ini-production.
; CVE-2026-109618: an out-of-memory failure during a request can reach the
; vulnerable cleanup path. Until PHP 8.3.36 is deployed, no memory limit an
; attacker can hit, and request bodies capped as PHP's advisory recommends.
memory_limit = -1
upload_max_filesize = 30M
post_max_size = 32M
max_execution_time = 90
expose_php = Off

; Upload progress tracking parses every multipart body into the session before
; the application runs (CVE-2026-109618/-109619). Drupal does not use it.
session.upload_progress.enabled = Off
session.use_strict_mode = On

; APCu holds the class loader and the bootstrap, config and discovery caches.
apc.shm_size = 64M
apc.ttl = 86400
apc.user_ttl = 86400

opcache.memory_consumption = 128M
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 8192
; The code in the image never changes.
opcache.validate_timestamps = 0
