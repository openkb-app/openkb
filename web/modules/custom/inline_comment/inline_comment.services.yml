services:
  # The stored messages: which entity a request is about, and how a
  # translation's set is reconciled, read and dropped.
  inline_comment.manager:
    class: Drupal\inline_comment\InlineCommentManager
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@datetime.time'
      - '@logger.channel.inline_comment'
  Drupal\inline_comment\InlineCommentManager: '@inline_comment.manager'
  # Who the endpoint answers: the API permission, and the subject's own update
  # access.
  inline_comment.api_access:
    class: Drupal\inline_comment\Access\InlineCommentApiAccess
    arguments: ['@inline_comment.manager']
  logger.channel.inline_comment:
    parent: logger.channel_base
    arguments: ['inline_comment']
