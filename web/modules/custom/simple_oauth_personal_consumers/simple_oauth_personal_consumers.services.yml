services:
  simple_oauth_personal_consumers.manager:
    class: Drupal\simple_oauth_personal_consumers\PersonalConsumerManager
    arguments:
      - '@entity_type.manager'
      - '@uuid'
      - '@simple_oauth.expired_collector'
      - '@config.factory'
      - '@datetime.time'
      - '@database'
  Drupal\simple_oauth_personal_consumers\PersonalConsumerManagerInterface: '@simple_oauth_personal_consumers.manager'

  simple_oauth_personal_consumers.admin_owner_gate:
    class: Drupal\simple_oauth_personal_consumers\EventSubscriber\AdminOwnerGateSubscriber
    arguments:
      - '@current_user'
      - '@simple_oauth_personal_consumers.manager'
      - '@logger.channel.simple_oauth_personal_consumers'
    tags:
      - { name: event_subscriber }

  logger.channel.simple_oauth_personal_consumers:
    parent: logger.channel_base
    arguments: ['simple_oauth_personal_consumers']
