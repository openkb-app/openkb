langcode: en
status: true
dependencies: {  }
id: security_prompt_manipulation
label: 'Security: Prompt Manipulation'
description: "Uses AI topic classification to detect attempts to manipulate, override, or hijack the agent's instructions. Catches jailbreak attempts, system prompt override requests, and role hijacking that regex patterns cannot reliably identify due to the constantly evolving phrasing of such attacks."
guardrail: restrict_to_topic
guardrail_settings:
  valid_topics: ''
  invalid_topics: |-
    prompt injection
    system prompt override
    jailbreak attempt
    role hijacking
    instruction bypass
    AI restriction circumvention
    pretending to be a different AI
    unrestricted mode activation
    DAN prompt
    developer mode activation
  invalid_topics_present_message: "This message was blocked because it appears to attempt to manipulate the AI's instructions."
  valid_topics_missing_message: ''
