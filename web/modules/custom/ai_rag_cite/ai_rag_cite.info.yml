name: 'AI RAG citations'
description: 'Grounds an AI assistant in retrieved sources: retrieves before the model runs, hands it a numbered source list to cite, either marks an answer without sources or abstains outright depending on the mode, and answers the cited sources back as response metadata.'
type: module
package: 'AI'
core_version_requirement: ^11.3
# search_api because the one retriever shipped queries an index; a site with
# a retriever of its own carries it for nothing.
dependencies:
  - ai:ai
  - ai:ai_assistant_api
  - drupal:path_alias
  - search_api:search_api
