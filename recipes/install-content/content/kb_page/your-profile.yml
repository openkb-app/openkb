        # Your profile {#b-4d7bfb87}

        ## Goal {#b-be8a781e}

        Change the name others see, your password and your picture. {#b-b42ce9b7}

        ## Steps {#b-a1ea3016}

        ::block{#b-b90e7a2f}
        1. Open the account menu at the bottom of the sidebar and choose "Edit profile".
        2. "Username" is the name others see, in mentions and bylines. Type a new one to change it.
        3. To change your password, enter the "Current password" and the new password twice. If you forgot the current one, click "Reset your password".
        4. Under "Picture", choose an image. It uploads at once; "Remove" takes it away again.
        5. Click "Save".
        ::

        ## Good to know {#b-960391e3}

        ::block{#b-282b2e95}
        - A username is unique on the site. It cannot be an email address, contain " via ", or be "AI assistant" or "collab_server" in any letter case.
        - A new username shows everywhere at once, also in mentions written before the change.
        - If "Username" is grayed out and says "An administrator can change it.", the site keeps the names it gives. Ask an administrator.
        - You sign in with your email address. The profile does not show it, and only an administrator or a site manager changes it.
        ::

