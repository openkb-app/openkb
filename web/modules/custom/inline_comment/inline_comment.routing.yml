# One endpoint, three verbs. Which entity translation a request is about
# travels in the query (GET, DELETE) or the body (PUT), so the subject is named
# by the request rather than by the path — which is why access is a callback of
# its own rather than `_entity_access` on a path parameter.
inline_comment.read:
  path: '/api/inline-comments'
  defaults:
    _controller: '\Drupal\inline_comment\Controller\InlineCommentApiController::read'
    _title: 'Inline comments'
  methods: [GET]
  requirements:
    _custom_access: 'inline_comment.api_access:access'
  options:
    no_cache: TRUE

inline_comment.put:
  path: '/api/inline-comments'
  defaults:
    _controller: '\Drupal\inline_comment\Controller\InlineCommentApiController::put'
    _title: 'Inline comments'
  methods: [PUT]
  requirements:
    _custom_access: 'inline_comment.api_access:access'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE

inline_comment.delete:
  path: '/api/inline-comments'
  defaults:
    _controller: '\Drupal\inline_comment\Controller\InlineCommentApiController::delete'
    _title: 'Inline comments'
  methods: [DELETE]
  requirements:
    _custom_access: 'inline_comment.api_access:access'
    _csrf_request_header_token: 'TRUE'
  options:
    no_cache: TRUE
