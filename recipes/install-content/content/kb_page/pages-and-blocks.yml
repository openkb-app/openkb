        # Pages and blocks {#b-16c2d337}

        ## What is a page? {#b-9bcf3ca6}

        A page is a Markdown document in one space. It has a title, a body, a type, and optional tags, a summary and an owner. Its address is the space's address followed by the title, for example /engineering/onboarding. Moving a page to another space gives it a new address, see [Spaces](/openkb-user-guide/spaces). {#b-ce6563d9}

        ## What is a block? {#b-929bb6c8}

        The body is a sequence of blocks: a paragraph, a heading, a list, a table, a code block, an image, a callout. Each block carries a stable id. The id stays with the block when the block moves or when other blocks are added around it. {#b-403a81f0}

        The ids are what make a block addressable: {#b-ba1b1ff7}

        ::block{#b-770f9bcd}
        - Link to it. Hover a block on a page and click the ¶ sign. The block's address is copied.
        - Cite it. The assistant's answers cite blocks, and a citation opens the page on that block. See [Ask OpenKnowledgebase](/openkb-user-guide/ask-openknowledgebase).
        - Review it. Every changed block is one review item. See [Drafts, publish and sign-off](/openkb-user-guide/drafts-publish-and-sign-off).
        - Comment on it. Comments hang on a block.
        - See who wrote it. Hover a block and click the ⓘ sign. The card "About this block" shows who edited it, its review state and its sources.
        ::

        You never type a block id. In the Markdown of a page (the ".md" link and "Copy as Markdown") the ids appear as `{#b-…}` after a paragraph, or as a `::block{#b-…}` wrapper around a list or a table. {#b-2dfd9805}

        ## Related topics {#b-981b6f8b}

        ::block{#b-f5440271}
