        # Backups and updates {#b-056825f4}

        ## Goal {#b-2c839641}

        Keep the site safe and current. {#b-c86a6be3}

        ## Backups {#b-06d47746}

        Back up three things together: the database, the Drupal files volume, and the collaboration store that holds edits not yet saved to Drupal. The search index is not backed up; it is rebuilt. The exact commands, and how to restore, are in the public documentation: [Volumes and backup](https://github.com/openkb-app/openkb/blob/1.x/docs/self-hosting.md#volumes-and-backup). {#b-8948655a}

        ## Updates {#b-481e09f1}

        ::block{#b-7ad083b1}
        1. Back up first.
        2. Set the new version in `OPENKB_TAG` in the `.env` file, then pull the images and restart.
        3. Run the database updates at `/update.php` on the administration host. The steps are in [Updates](https://github.com/openkb-app/openkb/blob/1.x/README.md#updates).
        ::

        Nothing updates unattended. The release notes are on the releases page of the public repository. {#b-5030829a}

        ## Where to look when something is off {#b-d6323ea5}

        ::block{#b-32ce4031}
        - The site's own log: `/admin/reports/dblog` on the administration host.
        - The status report: `/admin/reports/status` on the administration host.
        - Logs, resources and the install marker: [Resources and logs](https://github.com/openkb-app/openkb/blob/1.x/docs/self-hosting.md#resources-and-logs).
        ::

