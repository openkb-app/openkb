        # Semantic search {#b-b64c5a09}

        What search does, and where to start, is on [Finding things](/openkb-user-guide/finding-things). This page is about the index behind it. {#b-a5791e13}

        ## What the index holds {#b-bf5e79f8}

        Every published page is cut into sections: a heading and the blocks under it. Each section is stored in the search index with its meaning (an embedding) and its words. A search combines both: pages about the question, and pages holding its words. {#b-673a671c}

        The index feeds everything that finds pages: the search page, the "AI summary", the assistant, the `[[` link picker and the agents' search tool. {#b-e446559f}

        ## When a page appears {#b-69b5dbd1}

        ::block{#b-5dbdf5dd}
        - A page is indexed when it is published. Saving a draft changes nothing in the index.
        - Indexing happens at save time. A published page is usually found right away. Cron catches up on anything left over.
        - The index only ever answers with pages you may read. Read access is checked at query time.
        ::

        ## Why an answer may miss a page {#b-0e258b26}

        ::block{#b-39ec78e0}
        - The page is not published yet.
        - The AI is not turned on. Search by meaning needs it, see [Turning on AI](/openkb-user-guide/turning-on-ai).
        - The words are spelled differently. The index folds case and accents but does not stem words.
        ::

        ## Related topics {#b-3d4b95dd}

        ::block{#b-39451ac3}
        - [Finding things](/openkb-user-guide/finding-things)
        - [Ask OpenKnowledgebase](/openkb-user-guide/ask-openknowledgebase)
        ::
