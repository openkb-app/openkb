# git-cliff configuration: generates CHANGELOG.md from the history of this
# repository, for the release workflow.
#
# A commit here is a sync of one dev commit: its subject, then the
# `Sync from openkb-dev-project <sha>.` line, which is not conventional and
# drops out with the rest of the unconventional ones. Every line counts as one
# entry. The
# preprocessors are the second pass over a tracker id or a pull-request number
# the sync did not strip.

[changelog]
header = """
# Changelog

"""
# Each entry links its commit here; each version heading compares it with the
# previous one.
body = """
{% set repo = "https://github.com/openkb-app/openkb" %}\
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]{% if previous.version %}({{ repo }}/compare/{{ previous.version }}...{{ version }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**Breaking change**] {% endif %}{{ commit.message | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
# A `!` commit is kept even when its type is skipped.
protect_breaking_commits = true
split_commits = true
# Tracker ids and PR numbers never reach the generated file.
commit_preprocessors = [
    { pattern = '\b(OKB|CSR|MCD|LDP|MOP)-[0-9]+[:/]?[ \t]*', replace = "" },
    { pattern = '(?m) \(#[0-9]+\)$', replace = "" },
]
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^improve", group = "<!-- 2 -->Improvements" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(chore|ci|test|refactor|build|style)", skip = true },
    { message = ".*", skip = true },
]
filter_commits = false
# Versions only: an image revision (`v1.2.3+r1`) is no release of its own.
tag_pattern = "^v[0-9][^+]*$"
sort_commits = "oldest"
